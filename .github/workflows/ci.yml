name: Whyte Quotation CI

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Automated Test Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MongoDB 7.0 Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "try { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }); } catch (e) { print(e); }" --quiet; do
            echo "Waiting for MongoDB replica set to initialize..."
            sleep 2
          done
          # Wait until replica set is primary
          until docker exec mongodb mongosh --eval "rs.isMaster().ismaster" --quiet | grep -q "true"; do
            echo "Waiting for replica set primary election..."
            sleep 1
          done
          echo "MongoDB 7.0 Replica Set rs0 is ready and PRIMARY on 127.0.0.1:27017."
          docker exec mongodb mongosh --eval "rs.status()" --quiet

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint static analysis
        run: npm run lint

      - name: Run unified unit and integration test suites
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/whyte_test?replicaSet=rs0
          NEXTAUTH_SECRET: ci_test_dummy_secret_32_characters_long_min
          NEXTAUTH_URL: http://localhost:3000
          WHATSAPP_BRIDGE_SECRET: ci_test_bridge_secret
        run: npm test

      - name: Run real Playwright browser E2E test suite
        env:
          NODE_ENV: test
          PLAYWRIGHT_MODULE: ./node_modules/playwright
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017
          NEXTAUTH_SECRET: ci_test_dummy_secret_32_characters_long_min
          NEXTAUTH_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Validate Next.js production build
        env:
          NODE_ENV: production
          NEXTAUTH_SECRET: ci_test_dummy_secret_32_characters_long_min
          NEXTAUTH_URL: https://whyte-automation-sandy.vercel.app
          MONGODB_URI: mongodb://127.0.0.1:27017/ci_build_dummy?replicaSet=rs0
          DISABLE_PUBLIC_DNS_OVERRIDE: "true"
        run: npm run build

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-artifacts
          path: |
            test-results/
            screenshots/
            .next/
          retention-days: 7
