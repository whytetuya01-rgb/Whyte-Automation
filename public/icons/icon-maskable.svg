<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419" />
      <stop offset="100%" stop-color="#09090C" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#D85B83" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Accent glow orb behind W -->
  <circle cx="256" cy="240" r="120" fill="url(#accentGrad)" opacity="0.22" filter="url(#glow)" />

  <!-- Scaled down to safe zone (0.78 scale centered at 256, 230) -->
  <g transform="translate(128, 140) scale(0.80)">
    <path d="M 16 28 L 76 216 C 80 228 92 236 106 236 C 120 236 132 228 136 216 L 160 140 L 184 216 C 188 228 200 236 214 236 C 228 236 240 228 244 216 L 304 28 C 308 14 298 0 284 0 L 252 0 C 242 0 232 6 228 16 L 194 136 L 174 72 C 170 58 158 48 144 48 L 140 48 C 126 48 114 58 110 72 L 90 136 L 56 16 C 52 6 42 0 32 0 L 4 0 C -8 0 -18 14 -14 28 Z"
          fill="url(#accentGrad)" />

    <circle cx="160" cy="18" r="14" fill="#FFFFFF" opacity="0.95" />
    <circle cx="160" cy="18" r="8" fill="#D85B83" />
  </g>

  <!-- Subtitle Text inside safe zone -->
  <text x="256" y="375" 
        text-anchor="middle" 
        font-family="'Raleway', 'Segoe UI', system-ui, sans-serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="8" 
        fill="#FFFFFF" 
        opacity="0.92">WHYTE</text>
  <text x="256" y="398" 
        text-anchor="middle" 
        font-family="'Raleway', 'Segoe UI', system-ui, sans-serif" 
        font-size="12" 
        font-weight="500" 
        letter-spacing="4" 
        fill="#D85B83">AUTOMATION</text>
</svg>
